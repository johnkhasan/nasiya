services:
  db:
    image: postgres:16-alpine
    # Explicit, project-unique name — the plain "db" alias Compose also
    # gives this container collides with any OTHER project's own "db"
    # service if `app` ever joins that project's network too (see
    # docker-compose.override.yml): Docker's embedded DNS resolved "db"
    # to a *different* Postgres entirely once nasiya-app-1 had both
    # networks attached, and it authenticated against the wrong database
    # with the right-looking error ("password authentication failed") —
    # confusing to debug since the credentials genuinely were correct.
    container_name: nasiya-db-1
    restart: unless-stopped
    environment:
      POSTGRES_DB: nasiya
      POSTGRES_USER: nasiya
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No ports exposed — only reachable from other containers on this network.
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nasiya -d nasiya"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-off: `docker compose run --rm migrate` after pulling a new app
  # image, before restarting `app`. Never started by `docker compose up`.
  migrate:
    image: ghcr.io/${GHCR_OWNER}/nasiya-migrate:latest
    environment:
      DATABASE_URL: postgresql://nasiya:${DB_PASSWORD}@nasiya-db-1:5432/nasiya
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]
    profiles: ["tools"]

  app:
    image: ghcr.io/${GHCR_OWNER}/nasiya-app:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://nasiya:${DB_PASSWORD}@nasiya-db-1:5432/nasiya
      AUTH_URL: ${AUTH_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME}
      # Next.js standalone's server.js does
      # `process.env.HOSTNAME || '0.0.0.0'` for its bind address, and
      # Docker sets HOSTNAME to the container ID for every container by
      # default. Normally harmless (that ID still resolves to the
      # container's one network), but with `app` on two networks (see
      # docker-compose.override.yml) it resolved to only one of them —
      # nginx on the other network got connection-refused even though
      # the app was up. Force the real default back.
      HOSTNAME: "0.0.0.0"
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

  worker:
    image: ghcr.io/${GHCR_OWNER}/nasiya-worker:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://nasiya:${DB_PASSWORD}@nasiya-db-1:5432/nasiya
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

  # Only started on a dedicated server with free 80/443
  # (`docker compose --profile standalone-nginx up -d`). If this project
  # shares a server with something that already owns those ports, see
  # docker-compose.override.yml and DEPLOY.md § "Shared nginx" instead —
  # these two services stay out of the way otherwise.
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot
    depends_on: [app]
    networks: [internal]
    profiles: ["standalone-nginx"]

  certbot:
    image: certbot/certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h; done'"
    profiles: ["standalone-nginx"]

  uptime-kuma:
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    ports: ["127.0.0.1:3001:3001"] # SSH tunnel only
    volumes:
      - kuma-data:/app/data

volumes:
  pgdata:
  certbot-etc:
  certbot-www:
  kuma-data:

networks:
  internal:
