# Used ONLY for the very first deploy, before a certificate exists yet.
# certbot needs port 80 answered by nginx to complete the HTTP-01 challenge;
# the real docker/nginx.conf (with the 443/ssl server block) would fail to
# start at that point because the cert files it references don't exist yet.
# See DEPLOY.md step "First SSL certificate".

server {
    listen 80;
    server_name app.YOUR_DOMAIN;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 "OK - waiting for SSL setup\n";
        add_header Content-Type text/plain;
    }
}
