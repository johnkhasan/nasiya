# Replace app.YOUR_DOMAIN with your real domain everywhere in this file
# before the first deploy.

limit_req_zone $binary_remote_addr zone=applimit:10m rate=20r/s;

server {
    listen 80;
    server_name app.YOUR_DOMAIN;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name app.YOUR_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/app.YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.YOUR_DOMAIN/privkey.pem;

    limit_req zone=applimit burst=40 nodelay;

    location / {
        proxy_pass http://app:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
