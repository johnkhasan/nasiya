name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push app image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.app
          target: runner
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/nasiya-app:latest

      - name: Build & push migrate image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.app
          target: migrate
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/nasiya-migrate:latest

      - name: Build & push worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.worker
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/nasiya-worker:latest

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            export GHCR_OWNER=${{ github.repository_owner }}
            cd /srv/nasiya
            docker compose pull app migrate worker
            docker compose run --rm migrate
            docker compose up -d app worker
            docker image prune -f
