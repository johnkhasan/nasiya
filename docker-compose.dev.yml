services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nasiya
      POSTGRES_USER: nasiya
      POSTGRES_PASSWORD: nasiya_dev_password
    ports:
      - "5433:5432"
    volumes:
      - nasiya_pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nasiya -d nasiya"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nasiya_pgdata_dev:
